<!doctype html><meta charset="utf-8"><title>Tick logo system</title>
<style>
body{margin:0;padding:28px;background:#F5F8EC;font-family:-apple-system,"Segoe UI",sans-serif;color:#16210F}
h1{margin:0 0 18px;font-size:22px}.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.c{background:#fff;border:1px solid #E4EAD5;border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:10px}
.c small{color:#6B7560;font-size:13px}.c img{width:100%;max-height:150px;object-fit:contain}
.wide{grid-column:span 2}.row{display:flex;gap:18px;align-items:center;font-weight:800;font-size:38px;letter-spacing:-1px}
.row img{width:.9em;height:.9em}.dark{background:#16210F;color:#C9F26B}.dark small{color:#9BA88C}
</style>
<h1>Tick — currency sign &amp; logo</h1>
<div class="g">
<div class="c"><img src="tick-sign.svg"><small>Currency sign (monochrome, inherits colour)</small></div>
<div class="c"><img src="tick-sign-on-lime.svg"><small>App tile · lime</small></div>
<div class="c"><img src="tick-sign-on-ink.svg"><small>App tile · ink</small></div>
<div class="c wide"><img src="tick-lockup.svg" style="max-height:110px"><small>Lockup with wordmark</small></div>
<div class="c"><div class="row"><img src="tick-sign.svg">86,400</div><div class="row"><img src="tick-sign.svg">3,600</div><small>In use, like $ or €</small></div>
<div class="c dark wide"><div class="row"><img src="tick-sign-on-ink.svg" style="width:1.4em;height:1.4em">12h 30m</div><small>On dark</small></div>
</div>
