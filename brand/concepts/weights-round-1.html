<!doctype html><meta charset="utf-8"><title>Tons sign concepts</title>
<style>
body{margin:0;padding:24px;background:#F5F8EC;font-family:-apple-system,"Segoe UI",sans-serif;color:#16210F}
h1{font-size:20px;margin:0 0 14px}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.c{background:#fff;border:1px solid #E4EAD5;border-radius:22px;padding:14px}.c h2{margin:0 0 2px;font-size:15px}.c p{margin:0 0 10px;color:#6B7560;font-size:12px;min-height:30px}
.tiles{display:flex;gap:8px}.tile{flex:1;aspect-ratio:1;border-radius:20px;display:grid;place-items:center}.lime{background:#C9F26B}.ink{background:#16210F;color:#C9F26B}.tile svg{width:66%}
.amt{display:flex;align-items:center;gap:5px;margin-top:10px;font-weight:800;font-size:30px;letter-spacing:-1px}.amt svg{width:.85em;height:.85em}
.sm{display:flex;gap:12px;align-items:center;margin-top:6px;color:#6B7560;font-size:13px}
</style>
<h1>Tons currency sign — concepts</h1><div class="row" id="r"></div>
<script>
const S='fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"';
const svg=(inner,w=5.5)=>`<svg viewBox="0 0 64 64" ${S} stroke-width="${w}">${inner}</svg>`;
const C=[
 {n:'1 · Ton weight',d:'The classic "1 TON" block: trapezoid body, handle ring, a T stamped on it.',
  g:svg('<path d="M10 58 L17 24 H47 L54 58 Z"/><path d="M24 24 C24 4 40 4 40 24"/><path d="M24 36 H40 M32 36 V50"/>')},
 {n:'2 · Anvil-T',d:'A T on a pedestal — crossbar is the anvil face, stem the waist, foot the base.',
  g:svg('<path d="M7 13 H57"/><path d="M32 13 V45"/><path d="M17 56 H47"/><path d="M26 45 H38"/>',6)},
 {n:'3 · Kettlebell-T',d:'A kettlebell (gym = health!) with the T cut into its belly.',
  g:svg('<circle cx="32" cy="39" r="21"/><path d="M19 24 C19 4 45 4 45 24"/><path d="M23 35 H41 M32 35 V50"/>')},
 {n:'4 · Ingot-T',d:'A gold-bar ingot in perspective with a T stamped on its face.',
  g:svg('<path d="M6 50 L12 28 H52 L58 50 Z"/><path d="M12 28 L19 14 H45 L52 28"/><path d="M24 37 H40 M32 37 V45"/>')},
 {n:'5 · Scale-T',d:'A balance scale IS a T: beam, post, base, two pans.',
  g:svg('<path d="M9 14 H55 M32 8 V52 M20 54 H44"/><path d="M13 14 V24 M5 26 Q13 40 21 26 Z M51 14 V24 M43 26 Q51 40 59 26 Z"/>',4.5)},
 {n:'6 · Press-T',d:'A heavy slab T squashing a coin — weight pressing down.',
  g:svg('<path d="M8 10 H56 M32 10 V38"/><ellipse cx="32" cy="52" rx="22" ry="7"/><path d="M14 52 V46 H50 V52" opacity=".0"/>',6)},
 {n:'7 · Block-T',d:'A solid rounded block with a T cut out, handle on top.',
  g:`<svg viewBox="0 0 64 64" ${S} stroke-width="5.5"><path d="M24 20 C24 4 40 4 40 20"/><rect x="8" y="20" width="48" height="38" rx="10" fill="currentColor" stroke="none"/><path d="M22 32 H42 M32 32 V48" stroke="#C9F26B" stroke-width="6" class="cut"/></svg>`},
 {n:'8 · Tonne arch',d:'T whose crossbar bows under load, like a loaded beam.',
  g:svg('<path d="M8 16 Q32 28 56 16"/><path d="M32 23 V54"/><path d="M22 56 H42"/>',6)},
];
document.getElementById('r').innerHTML=C.map(c=>`<div class="c"><h2>${c.n}</h2><p>${c.d}</p><div class="tiles"><div class="tile lime" style="color:#16210F">${c.g}</div><div class="tile ink">${c.g.replace(/stroke="#C9F26B"/,'stroke="#16210F"')}</div></div>
<div class="amt">${c.g}<span>1,240</span></div><div class="sm">${c.g.replace('<svg','<svg style="width:20px;height:20px"')}<span>20px</span>${c.g.replace('<svg','<svg style="width:14px;height:14px"')}<span>14px</span></div></div>`).join('');
</script>
